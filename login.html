<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Gradenix</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<script>if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');</script>
<button id="themeToggle" class="theme-toggle-fixed" type="button" onclick="toggleTheme()" aria-label="Toggle light/dark theme"></button>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">⬡</span>
      <div class="logo-title">GRADENIX</div>
      <small>Student Performance Predictor</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-bottom:16px">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <h2>Sign In</h2>
    <form method="POST" action="/login">
      <input class="auth-input" type="text"     name="username" placeholder="Username" required autofocus>
      <div class="pw-wrap">
        <input class="auth-input" id="pw-login" type="password" name="password" placeholder="Password" required>
        <button type="button" class="eye-btn" onclick="togglePw('pw-login',this)" aria-label="Show password">
          <svg class="eye-icon eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-icon eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <button class="auth-btn" type="submit">→ SIGN IN</button>
    </form>
    <div class="auth-link">No account? <a href="/signup">Create one</a></div>
  </div>
</div>
<script>
function togglePw(id, btn) {
  var inp = document.getElementById(id);
  var showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  btn.querySelector('.eye-show').style.display = showing ? '' : 'none';
  btn.querySelector('.eye-hide').style.display = showing ? 'none' : '';
}

function updateThemeLabel() {
  var btn = document.getElementById('themeToggle');
  var isDark = document.body.classList.contains('dark');
  btn.textContent = isDark ? '☀ LIGHT MODE' : '☾ DARK MODE';
}
function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  updateThemeLabel();
}
updateThemeLabel();
</script>
</body>
</html>
